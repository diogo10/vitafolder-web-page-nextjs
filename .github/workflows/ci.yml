name: CI

on:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit/integration tests with coverage
        run: npm run test:cov
        env:
          # SUPABASE_URL is required (no default); unit tests inject explicit
          # endpoint/anonKey overrides, so a placeholder is enough here.
          SUPABASE_URL: https://example.supabase.co

      - name: Production build
        run: npm run build
        env:
          SUPABASE_URL: https://example.supabase.co

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: E2E tests
        run: npm run e2e
        env:
          # Placeholder URL + intentionally no SUPABASE_ANON_KEY: the invite
          # Server Action short-circuits with a generic error, so E2E
          # specs never make live Supabase calls.
          SUPABASE_URL: https://example.supabase.co
  call-bob:
    needs: [ci]
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
    uses: ./.github/workflows/opencode-review-bob.yml
    secrets: inherit
